[package]
name = "fetch-local"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
publish = false
description = "Local MCP management and sharing for macOS"

[lib]
name = "fetch_local"
path = "src/lib.rs"

[[bin]]
name = "fetch"
path = "src/main.rs"

[[test]]
name = "connector_clients"
path = "tests/connector_support/client_smoke.rs"
harness = false

[dependencies]
aes-gcm = "0.10"
axum = "0.8.9"
axum-server = { version = "0.8.0", default-features = false, features = ["tls-rustls-no-provider"] }
clap = { version = "4.5", features = ["derive"] }
fs2 = "0.4"
jsonc-parser = "0.34"
libc = "0.2"
rand = "0.8"
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "ring"] }
rustls-pemfile = "2.2"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value", "arbitrary_precision"] }
serde-saphyr = { version = "=2.1.1", default-features = false, features = ["serialize", "deserialize"] }
sha2 = "0.10"
shlex = "=2.0.1"
tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "net", "process", "io-util", "io-std", "fs"] }
toml = "1.1"
url = "2.5"
zeroize = { version = "1", features = ["derive"] }
zstd = { version = "0.13", default-features = false }

base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
futures-util = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "http2", "stream"] }
iced = { version = "0.14.0", default-features = false, features = ["wgpu", "tokio", "svg", "image-without-codecs", "markdown"] }
resvg = { version = "=0.45.1", default-features = false }
rmcp = { version = "=3.8.0", default-features = false, features = ["auth", "client"] }
oauth2 = { version = "5", default-features = false }
async-trait = "0.1"
iced_term = { path = "vendor/iced_term" }
portable-pty = "=0.9.0"

[build-dependencies]
cc = "1"

[dev-dependencies]
rmcp = { version = "=3.8.0", default-features = false, features = ["client", "transport-async-rw"] }
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
strip = true

# The design's soft SVG shadows run CPU blur filters on their first render.
# Optimize only these libraries so debug UI startup does not stall on those blurs.
[profile.dev.package.resvg]
opt-level = 3

[profile.dev.package.tiny-skia]
opt-level = 3

# Console history and terminal labels use the native text shaper. Keep this
# existing library path optimized so opening retained logs stays responsive.
[profile.dev.package.cosmic-text]
opt-level = 3

[profile.dev.package.swash]
opt-level = 3
