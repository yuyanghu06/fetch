[package]
name = "fetch-local"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
publish = false
description = "Local MCP management and sharing for macOS"

[lib]
name = "fetch_local"
path = "src/lib.rs"

[[bin]]
name = "fetch"
path = "src/main.rs"

[dependencies]
aes-gcm = "0.10"
axum = "0.8.9"
axum-server = { version = "0.8.0", default-features = false, features = ["tls-rustls-no-provider"] }
clap = { version = "4.5", features = ["derive"] }
fs2 = "0.4"
jsonc-parser = "0.34"
libc = "0.2"
rand = "0.8"
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "ring"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value", "arbitrary_precision"] }
sha2 = "0.10"
tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "net"] }
toml = "1.1"
url = "2.5"
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
http-body-util = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "http2"] }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
strip = true
